plugins {
    id 'com.android.application'
}

android {
    namespace 'com.together.camera'
    compileSdk 35

    defaultConfig {
        applicationId 'com.together.camera'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
