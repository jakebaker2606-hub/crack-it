name: Together Camera Runtime Test

on:
  push:
    branches:
      - together-camera-build
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: together-camera
        run: gradle --no-daemon assembleDebug
      - name: Emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r together-camera/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.together.camera android.permission.CAMERA || true
            adb shell am force-stop com.together.camera
            adb logcat -c
            adb shell am start -n com.together.camera/.MainActivity
            sleep 8
            echo "=== ACTIVITY ==="
            adb shell dumpsys activity activities | grep -A 6 com.together.camera || true
            echo "=== CRASH LOG ==="
            adb logcat -d -v brief | grep -E "FATAL EXCEPTION|AndroidRuntime|com.together.camera|Process: com.together.camera" | tail -n 250
