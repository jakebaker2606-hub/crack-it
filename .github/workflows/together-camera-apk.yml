name: Together Camera APK

on:
  push:
    branches:
      - together-camera-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: together-camera
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp together-camera/app/build/outputs/apk/debug/app-debug.apk Together_Camera_v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Together_Camera_v1.0.0
          path: Together_Camera_v1.0.0.apk
          if-no-files-found: error
          retention-days: 3
